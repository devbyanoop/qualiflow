[project]
name = "qualiflow-agents"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "litellm>=1.50",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
markers = [
    "requires_novapay: needs a live NovaPay at localhost:4000 (separate repo, not vendored); skipped automatically if unreachable, see tests/integration/conftest.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qualiflow_agents"]
