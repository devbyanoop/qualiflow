name: qualiflow

# Runs the same whether the active docker context is local or remote
# (this machine's default context is the ssh://data@192.168.1.14
# "fedora-host" context) — every volume below is a named volume, which
# the daemon manages on its own side, never a bind mount to a path on
# THIS machine. The one service with real config (Prometheus) gets it
# baked into a custom image at build time instead, for the same reason.

services:
  postgres:
    # Prometheus-style custom image: the init script only needs to exist
    # on first startup against a fresh volume, so build: works the same
    # whether the daemon is local or remote.
    build: ./infra/postgres
    environment:
      POSTGRES_USER: ${QUALIFLOW_PG_USER}
      POSTGRES_PASSWORD: ${QUALIFLOW_PG_PASSWORD}
      POSTGRES_DB: ${QUALIFLOW_PG_DB}
      QUALIFLOW_PG_APP_PASSWORD: ${QUALIFLOW_PG_APP_PASSWORD}
    ports:
      - "${QUALIFLOW_PG_PORT}:5432"
    volumes:
      - qualiflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QUALIFLOW_PG_USER} -d ${QUALIFLOW_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${QUALIFLOW_REDIS_PORT}:6379"

  embeddings:
    # Pinned, not cpu-latest -- a floating tag's version drift is a
    # real risk for a model-serving image. Official HF image, not a
    # random third-party pre-baked one.
    #
    # BAAI/bge-m3 (2.2GB on disk) OOM-killed (exit 137) repeatedly even
    # at ~11GB VM memory -- its CPU/ONNX warmup needs far more than its
    # disk size suggests, and pushing the host's Docker Desktop memory
    # limit further started starving the HOST itself (its own GUI
    # stopped responding). Switched to a much smaller multilingual
    # model instead of continuing to chase memory ceilings.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command: ["--model-id", "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"]
    ports:
      - "${QUALIFLOW_EMBEDDINGS_PORT}:80"
    volumes:
      - qualiflow_embeddings_cache:/data

  reranker:
    # Same TEI image, pointed at a cross-encoder reranking model
    # instead of an embeddings model -- TEI serves /rerank for this
    # model class instead of /embed. Plan §5.2 locks bge-reranker-v2-m3
    # specifically. CAUTION, stated plainly: this is architecturally
    # similar in scale to BAAI/bge-m3 (the embeddings model that
    # repeatedly OOM-killed on this machine, see the embeddings
    # service's own comment above) -- untested on this host yet. If it
    # OOMs the same way, the fallback is a smaller reranker, following
    # the exact same precedent as the embeddings model swap.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      - "${QUALIFLOW_RERANKER_PORT}:80"
    volumes:
      - qualiflow_reranker_cache:/data

  minio:
    # Neither minio/minio (Docker Hub) nor quay.io/minio/minio pull
    # anonymously anymore (MinIO locked down distribution; the one
    # remaining free community tag also carries a known CVE). Chainguard's
    # build is a legitimate, actively maintained anonymous alternative —
    # verified pullable without auth before pinning this.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${QUALIFLOW_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${QUALIFLOW_MINIO_ROOT_PASSWORD}
    ports:
      - "${QUALIFLOW_MINIO_API_PORT}:9000"
      - "${QUALIFLOW_MINIO_CONSOLE_PORT}:9001"
    volumes:
      - qualiflow_minio_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    # No config file mounted — the config is the whole YAML document
    # below, passed as one environment variable. The collector's `env:`
    # config provider reads it directly, so there's no file path to
    # resolve on the remote daemon at all.
    command: ["--config=env:OTELCOL_CONFIG"]
    environment:
      OTELCOL_CONFIG: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
        processors:
          batch: {}
        exporters:
          prometheus:
            endpoint: 0.0.0.0:8889
        service:
          pipelines:
            metrics:
              receivers: [otlp]
              processors: [batch]
              exporters: [prometheus]
    ports:
      - "${QUALIFLOW_OTEL_GRPC_PORT}:4317"
      - "${QUALIFLOW_OTEL_HTTP_PORT}:4318"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    # start-dev is explicitly not for production (see the image's own
    # --help output) — fine for the Walking Skeleton, revisit before
    # anything resembling a real deployment.
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${QUALIFLOW_KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${QUALIFLOW_KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${QUALIFLOW_KEYCLOAK_PORT}:8080"
    volumes:
      - qualiflow_keycloak_data:/opt/keycloak/data

  prometheus:
    build: ./infra/prometheus
    ports:
      - "${QUALIFLOW_PROMETHEUS_PORT}:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${QUALIFLOW_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${QUALIFLOW_GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${QUALIFLOW_GRAFANA_PORT}:3000"
    volumes:
      - qualiflow_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  qualiflow_pg_data:
  qualiflow_minio_data:
  qualiflow_grafana_data:
  qualiflow_keycloak_data:
  qualiflow_embeddings_cache:
  qualiflow_reranker_cache:
