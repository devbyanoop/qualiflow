name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (Python tooling)
        uses: astral-sh/setup-uv@v3

      - name: Install pnpm (JS tooling)
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install apps/api dependencies (incl. dev group)
        run: uv sync --project apps/api --group dev

      # No .env needed here — Settings() has defaults safe for import,
      # and these tests never call the real Keycloak (see test_main.py).
      # --ignore excludes the integration/ subfolder, which needs the
      # real Postgres from the job below — never mocked here.
      - name: pytest (apps/api, unit only)
        run: uv run --project apps/api pytest apps/api/tests --ignore=apps/api/tests/integration -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qualiflow
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: qualiflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QUALIFLOW_PG_HOST: localhost
      QUALIFLOW_PG_PORT: 5433
      QUALIFLOW_PG_USER: qualiflow
      QUALIFLOW_PG_PASSWORD: ci_pw
      QUALIFLOW_PG_APP_PASSWORD: ci_app_pw
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (Python tooling)
        uses: astral-sh/setup-uv@v3

      - name: Install apps/api dependencies (incl. dev group)
        run: uv sync --project apps/api --group dev

      # GitHub Actions can't build infra/postgres/Dockerfile as a
      # `services:` image directly (that only pulls pre-built images),
      # so this step does by hand exactly what
      # infra/postgres/init-app-role.sh does on a real deploy: create
      # the restricted, non-superuser role the app itself connects as.
      # It must run before migrations, since the migration GRANTs to
      # this role and that fails if the role doesn't exist yet.
      - name: Create restricted app role (mirrors infra/postgres/init-app-role.sh)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=ci_pw psql -h localhost -p 5433 -U qualiflow -d qualiflow -c \
            "CREATE ROLE qualiflow_app LOGIN PASSWORD 'ci_app_pw'; GRANT CONNECT ON DATABASE qualiflow TO qualiflow_app;"

      - name: Run migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: pytest (apps/api, integration — real Postgres, real RLS)
        run: uv run --project apps/api pytest apps/api/tests/integration -v

  agents:
    runs-on: ubuntu-latest
    # Requires a GROQ_API_KEY repo secret (Settings -> Secrets and
    # variables -> Actions -> New repository secret) once this repo is
    # pushed to GitHub -- it doesn't exist yet as of M0.4 (still local-
    # only per the M0.0 decision), so this job will fail on GROQ auth
    # until that secret is added.
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (Python tooling)
        uses: astral-sh/setup-uv@v3

      - name: Install apps/agents dependencies (incl. dev group)
        run: uv sync --project apps/agents --group dev

      # Deliberately NOT mocked -- apps/agents is the AUTHORING layer
      # (plan §3 principle 1: "AI authors and maintains; deterministic
      # engines execute"), which is supposed to call a real LLM. That's
      # different from generated test EXECUTION (ADR-002: no LLM in the
      # hot path of regression execution), which never does and never
      # will. Mocking this test would only prove a mock matches our own
      # assumptions, not that the real integration works -- so this job
      # makes one real, near-zero-cost call to Groq per run.
      - name: pytest (apps/agents — real Groq call, no mocking)
        run: uv run --project apps/agents pytest apps/agents/tests -v

  knowledge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qualiflow
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: qualiflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Plain pre-built image (unlike infra/postgres's custom build),
      # so this works directly as a services: entry. GitHub Actions
      # services: has no way to pass CLI args to the container, so
      # --model-id becomes the MODEL_ID env var instead (confirmed via
      # the image's own --help: every CLI flag has an env equivalent).
      # The small multilingual model (~470MB), not BAAI/bge-m3 -- see
      # docker-compose.yml's embeddings service comment for why.
      embeddings:
        image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
        env:
          MODEL_ID: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        ports:
          - 8085:80
    env:
      QUALIFLOW_PG_HOST: localhost
      QUALIFLOW_PG_PORT: 5433
      QUALIFLOW_PG_USER: qualiflow
      QUALIFLOW_PG_PASSWORD: ci_pw
      QUALIFLOW_PG_APP_PASSWORD: ci_app_pw
      QUALIFLOW_EMBEDDINGS_PORT: 8085
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (Python tooling)
        uses: astral-sh/setup-uv@v3

      # Migrations live in apps/api's Alembic environment (the single
      # shared schema source — see apps/api/alembic/versions/
      # ae3bdda90862), so this job needs apps/api installed too, even
      # though the tests below only exercise apps/knowledge.
      - name: Install apps/api dependencies (for migrations)
        run: uv sync --project apps/api --group dev

      - name: Create restricted app role (mirrors infra/postgres/init-app-role.sh)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=ci_pw psql -h localhost -p 5433 -U qualiflow -d qualiflow -c \
            "CREATE ROLE qualiflow_app LOGIN PASSWORD 'ci_app_pw'; GRANT CONNECT ON DATABASE qualiflow TO qualiflow_app;"

      - name: Run migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Install apps/knowledge dependencies (incl. dev group)
        run: uv sync --project apps/knowledge --group dev

      # Deliberately NOT mocked, same reasoning as apps/agents — this
      # is a real call to the self-hosted embeddings service, proving
      # the delta-hash skip against real storage, not an assumption.
      - name: pytest (apps/knowledge — real embeddings, real delta-hash)
        run: uv run --project apps/knowledge pytest apps/knowledge/tests/integration -v
