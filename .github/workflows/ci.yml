name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv (Python tooling)
        uses: astral-sh/setup-uv@v3

      - name: Install pnpm (JS tooling)
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install apps/api dependencies (incl. dev group)
        run: uv sync --project apps/api --group dev

      # No .env needed here — Settings() has defaults safe for import,
      # and these tests never call the real Keycloak (see test_main.py).
      - name: pytest (apps/api)
        run: uv run --project apps/api pytest apps/api/tests -v
